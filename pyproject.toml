[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lavlab-pythomics"
version = "0.1.1"
description = "Feature extraction from histology label maps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["histology", "image-analysis", "feature-extraction"]
authors = [{ name = "barrettMCW", email = "mjbarrett@mcw.edu" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-image",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "coverage[toml]>=6.2"]
visualization = ["glymur", "matplotlib"]

[project.scripts]
pythomics = "pythomics.cli:main"

[project.urls]
Documentation = "https://github.com/laviolette-lab/pythomics#readme"
Issues = "https://github.com/laviolette-lab/pythomics/issues"
Source = "https://github.com/laviolette-lab/pythomics"

[tool.hatch.build.targets.wheel]
packages = ["src/pythomics"]

[tool.hatch.env]
requires = ["uv"]

[tool.hatch.envs.default]
installer = "uv"
type = "virtual"
dependencies = []

[tool.hatch.envs.default.scripts]
build = "hatch build"

[tool.hatch.envs.test]
dependencies = ["pytest", "pytest-cov", "coverage[toml]>=6.2"]
[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
cov = "pytest --cov=src --cov-report=term-missing --cov-report=xml {args:tests}"

[tool.hatch.envs.lint]
dependencies = ["ruff>=0.4.0"]
[tool.hatch.envs.lint.scripts]
check = "ruff check src tests"
format = "ruff format src tests"
format-check = "ruff format src tests --check"
fix = "ruff check --fix --unsafe-fixes src tests"
all = ["format", "fix", "check"]

[tool.hatch.envs.types]
dependencies = ["mypy>=1.0.0"]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pythomics tests}"

[tool.hatch.envs.docs]
dependencies = [
  "mkdocs",
  "mkdocstrings[python]",
  "mkdocs-material",
  "mkdocs-autorefs",
  "mkdocs-minify-plugin",
  "mkdocs-material-extensions",
  "mkdocs-git-revision-date-localized-plugin",
]
[tool.hatch.envs.docs.scripts]
build-docs = "mkdocs build"
serve-docs = "mkdocs serve"

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.coverage.run]
source_pkgs = ["pythomics", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
pythomics = ["src/pythomics", "*/pythomics/src/pythomics"]
tests = ["tests", "*/pythomics/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",
  "W",   # pycodestyle
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "T20", # flake8-print (catches stray prints in library code)
  "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["T20"]
"src/pythomics/cli.py" = ["T20"]
"*" = ["E501"]              # Ignore line length for all files

[tool.ruff.lint.isort]
known-first-party = ["pythomics"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
